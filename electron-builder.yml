appId: com.church.projector
productName: Church Projector
copyright: Copyright © 2026 ArielFerger

directories:
  buildResources: resources
  output: release

# What goes into the asar:
#   - the electron-vite output under out/
#   - resources/ for icons/fonts (also referenced by build steps)
# Everything else is excluded by default.
files:
  - out/**/*
  - "!**/*.map"

# Bundled Bibles (and any future seed data) live next to the asar so they
# can be loaded at runtime via process.resourcesPath.
extraResources:
  - from: data
    to: data
    filter:
      - "**/*"
  # Los scripts de herramientas (Python, sin dependencias) viajan con la app:
  # quien la instala puede instalar/actualizar yt-dlp, ffmpeg y whisper, o
  # bajar videos, sin clonar el repositorio. Ver scripts/herramientas/README.md.
  - from: scripts/herramientas
    to: scripts/herramientas
    filter:
      - "*.py"
      - "*.md"
      - "*.cmd"
      - "*.sh"

# Windows
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  shortcutName: Church Projector
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Linux
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icons/icon.png
  category: AudioVideo
  maintainer: ArielFerger <arielferger@users.noreply.github.com>
  synopsis: App de proyección para iglesias — canciones, biblia, media, audio
  description: |
    App de escritorio para proyectar letras de canciones, versículos bíblicos,
    imágenes, videos y GIFs en una segunda pantalla durante el servicio,
    con reproducción de música de fondo independiente.
  artifactName: ${productName}-${version}-${arch}.${ext}

# Disable signing in CI by default — sign locally before publishing.
afterSign: null
