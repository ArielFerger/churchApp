appId: com.church.projector
productName: Church Projector
copyright: Copyright © 2026 ArielFerger

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - resources/**/*
  - data/**/*
  - "!**/*.map"

extraResources:
  - from: data/
    to: data/
    filter: "**/*"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/icon.ico

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icons/icon.png
  category: AudioVideo

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
