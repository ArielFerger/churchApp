<svg viewBox="0 0 1240 1010" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">
  <!-- Fondo -->
  <rect width="1240" height="1010" rx="14" fill="#0f172a"/>

  <!-- Título -->
  <text x="620" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">Church Projector — estructura y funcionalidades</text>
  <text x="620" y="68" text-anchor="middle" font-size="14" fill="#94a3b8">Electron · dos ventanas (Control + Proyección) · IPC tipado · v1.1.0</text>

  <!-- ════════ PROCESO MAIN ════════ -->
  <rect x="30" y="95" width="565" height="470" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="50" y="124" font-size="17" font-weight="700" fill="#34d399">⚙ electron/ — Proceso main (Node)</text>
  <text x="50" y="143" font-size="12" fill="#94a3b8">Ventanas, servicios, persistencia y protocolos. No conoce React.</text>

  <text x="55" y="172" font-size="14" font-weight="600" fill="#e2e8f0">main.ts</text>
  <text x="200" y="172" font-size="12.5" fill="#94a3b8">arranque, wiring de scanners y push de settings</text>

  <!-- windows -->
  <rect x="50" y="186" width="520" height="58" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="62" y="207" font-size="13.5" font-weight="600" fill="#e2e8f0">windows/</text>
  <text x="75" y="226" font-size="12.5" fill="#94a3b8">controlWindow · projectionWindow — la proyección nunca se cierra, se muda de monitor en caliente</text>

  <!-- ipc -->
  <rect x="50" y="252" width="520" height="116" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="62" y="273" font-size="13.5" font-weight="600" fill="#e2e8f0">ipc/</text>
  <text x="160" y="273" font-size="12" fill="#64748b">handlers tipados por dominio</text>
  <text x="75" y="293" font-size="12.5" fill="#94a3b8">projection · settings · displays — comandos y configuración</text>
  <text x="75" y="312" font-size="12.5" fill="#94a3b8">files (3 índices de media) · songs · bible (+stats de versículos)</text>
  <text x="75" y="331" font-size="12.5" fill="#94a3b8">audio (+playlists persistidas) · fonts (CRUD de fuentes subidas)</text>
  <text x="75" y="352" font-size="12" fill="#64748b">canales en shared/constants.ts — nada de strings sueltos</text>

  <!-- services -->
  <rect x="50" y="376" width="520" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="62" y="397" font-size="13.5" font-weight="600" fill="#e2e8f0">services/</text>
  <text x="75" y="417" font-size="12.5" fill="#94a3b8">mediaScanner ×3 (media · loops En Vivo · fondos Biblia) con watcher</text>
  <text x="75" y="436" font-size="12.5" fill="#94a3b8">audioScanner + carátulas · songsService · bibleService (3 versiones)</text>
  <text x="75" y="455" font-size="12.5" fill="#94a3b8">settingsService · audioStateService · audioPlaylists · fontsService</text>
  <text x="75" y="476" font-size="12.5" fill="#fbbf24">protocolos: media:// · audio:// · appfont:// (ids registrados, con rangos)</text>

  <!-- preload -->
  <rect x="50" y="504" width="520" height="46" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="62" y="524" font-size="13.5" font-weight="600" fill="#e2e8f0">preload/</text>
  <text x="160" y="524" font-size="12.5" fill="#94a3b8">contextBridge seguro: control.ts · projection.ts</text>
  <text x="75" y="542" font-size="12" fill="#64748b">los renderers solo ven estas APIs — nunca rutas de archivos</text>

  <!-- ════════ VENTANA CONTROL ════════ -->
  <rect x="645" y="95" width="565" height="350" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="665" y="124" font-size="17" font-weight="700" fill="#60a5fa">🖥 src/control/ — Ventana del operador</text>

  <rect x="665" y="140" width="525" height="190" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="677" y="161" font-size="13.5" font-weight="600" fill="#e2e8f0">pages/</text>
  <text x="690" y="182" font-size="12.5" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="600">Live</tspan> — slide de prueba, fondo loop (carpeta propia), slideshow</text>
  <text x="690" y="201" font-size="12.5" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="600">Songs</tspan> — letras por secciones, álbumes</text>
  <text x="690" y="220" font-size="12.5" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="600">Bible</tspan> — búsqueda validada, historial, versiones, apariencia</text>
  <text x="690" y="239" font-size="12.5" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="600">Media</tspan> — galería con carpetas, cola de videos, transport + replay</text>
  <text x="690" y="258" font-size="12.5" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="600">Audio</tspan> — playlists con pestañas, cola, búsqueda</text>
  <text x="690" y="277" font-size="12.5" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="600">Settings</tspan> — pantalla, 5 carpetas de contenido, fades</text>
  <text x="690" y="300" font-size="12" fill="#64748b">components/: QuickRefPalette (buscador rápido) · AppearancePanel</text>
  <text x="690" y="318" font-size="12" fill="#64748b">(fuentes/fondo/tamaño) · MiniPlayer · QuickActions · LiveIndicator</text>

  <rect x="665" y="340" width="525" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="677" y="360" font-size="13.5" font-weight="600" fill="#e2e8f0">hooks/ + audio/</text>
  <text x="690" y="379" font-size="12.5" fill="#94a3b8">useProjectionBridge (telemetría + avance de cola) · audioEngine (Howler)</text>

  <text x="665" y="425" font-size="12.5" fill="#64748b">La música vive acá: es independiente de la proyección (blackout no la corta).</text>

  <!-- ════════ VENTANA PROYECCIÓN ════════ -->
  <rect x="645" y="465" width="565" height="240" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="665" y="494" font-size="17" font-weight="700" fill="#c084fc">📽 src/projection/ — Ventana proyectada</text>

  <rect x="665" y="510" width="525" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="677" y="531" font-size="13.5" font-weight="600" fill="#e2e8f0">components/ — sistema de capas</text>
  <text x="690" y="552" font-size="12.5" fill="#94a3b8">Capa 3 · <tspan fill="#e2e8f0">OverlayLayer</tspan> — blackout, logo</text>
  <text x="690" y="571" font-size="12.5" fill="#94a3b8">Capa 2 · <tspan fill="#e2e8f0">ContentLayer</tspan> — slides, versículos (+fondo propio y estilos</text>
  <text x="690" y="589" font-size="12.5" fill="#94a3b8">              configurables), media con crossfade · <tspan fill="#e2e8f0">MediaSlide</tspan> (fades, replay)</text>
  <text x="690" y="608" font-size="12.5" fill="#94a3b8">Capa 1 · <tspan fill="#e2e8f0">BackgroundLayer</tspan> — fondo loop / slideshow</text>
  <text x="690" y="627" font-size="12.5" fill="#94a3b8">Capa 0 · negro sólido</text>
  <text x="690" y="648" font-size="12" fill="#64748b">App.tsx: reducer de comandos, 3 índices de media, fuentes FontFace</text>

  <text x="665" y="688" font-size="12.5" fill="#64748b">Reporta posición/fin del video al control (scrubber y cola de videos).</text>

  <!-- ════════ SHARED ════════ -->
  <rect x="30" y="585" width="565" height="120" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="50" y="614" font-size="17" font-weight="700" fill="#fbbf24">🔗 src/shared/ — Común a ambas ventanas</text>
  <text x="55" y="638" font-size="12.5" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="600">types/</tspan> ipc (comandos+settings) · media · audio · bible · fonts · electronAPI</text>
  <text x="55" y="657" font-size="12.5" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="600">store/</tspan> settings · library · audio · videoQueue · liveControls · playback…</text>
  <text x="55" y="676" font-size="12.5" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="600">utils/</tspan> bibleBooks/parser · mediaFolders (subcarpetas) · fontLoader</text>
  <text x="55" y="695" font-size="12.5" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="600">constants.ts</tspan> — todos los canales IPC</text>

  <!-- Flechas IPC -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <path d="M 595 270 L 645 270" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="260" text-anchor="middle" font-size="10.5" fill="#60a5fa">IPC</text>
  <path d="M 645 580 L 595 470" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="603" y="528" text-anchor="middle" font-size="10.5" fill="#c084fc">telemetría</text>

  <!-- ════════ FILA INFERIOR ════════ -->
  <rect x="30" y="730" width="285" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="48" y="757" font-size="15" font-weight="700" fill="#e2e8f0">📚 data/</text>
  <text x="48" y="779" font-size="12.5" fill="#94a3b8">bibles/ — RVR1909 · RVR1960 ·</text>
  <text x="48" y="797" font-size="12.5" fill="#94a3b8">RVA2015 en JSON, empaquetadas</text>
  <text x="48" y="815" font-size="12.5" fill="#94a3b8">con la app (extraResources)</text>

  <rect x="335" y="730" width="285" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="353" y="757" font-size="15" font-weight="700" fill="#e2e8f0">🎨 resources/ + scripts/</text>
  <text x="353" y="779" font-size="12.5" fill="#94a3b8">icons/ (svg → ico/png/tray)</text>
  <text x="353" y="797" font-size="12.5" fill="#94a3b8">convert-bible.ts — genera biblias</text>
  <text x="353" y="815" font-size="12.5" fill="#94a3b8">build-icons.ts — regenera íconos</text>

  <rect x="640" y="730" width="285" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="658" y="757" font-size="15" font-weight="700" fill="#e2e8f0">📦 Empaquetado</text>
  <text x="658" y="779" font-size="12.5" fill="#94a3b8">electron-builder.yml — NSIS (Win),</text>
  <text x="658" y="797" font-size="12.5" fill="#94a3b8">AppImage + deb (Linux)</text>
  <text x="658" y="815" font-size="12.5" fill="#94a3b8">.github/workflows — CI + release</text>
  <text x="658" y="833" font-size="12.5" fill="#64748b">tag v* → Release con instaladores</text>

  <rect x="945" y="730" width="265" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="963" y="757" font-size="15" font-weight="700" fill="#e2e8f0">💾 userData (runtime)</text>
  <text x="963" y="779" font-size="12.5" fill="#94a3b8">settings · audio-state ·</text>
  <text x="963" y="797" font-size="12.5" fill="#94a3b8">audio-playlists.json ·</text>
  <text x="963" y="815" font-size="12.5" fill="#94a3b8">bible-fonts/ · songs/</text>

  <!-- ════════ FLUJO ════════ -->
  <rect x="30" y="875" width="1180" height="105" rx="10" fill="#0b1120" stroke="#334155"/>
  <text x="50" y="903" font-size="14" font-weight="700" fill="#e2e8f0">Flujo de un comando</text>
  <text x="50" y="928" font-size="13" fill="#94a3b8">Operador hace clic (Control)  ──▶  preload/control  ──▶  ipc/projection (main)  ──▶  preload/projection  ──▶  reducer de App.tsx  ──▶  capas en pantalla</text>
  <text x="50" y="953" font-size="13" fill="#94a3b8">Vuelta: la Proyección emite posición / fin de video  ──▶  Control actualiza el scrubber y avanza la cola. Los settings cambiados se pushean en vivo a la Proyección.</text>
</svg>
