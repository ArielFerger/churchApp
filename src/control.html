<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Sin Google Fonts: las fuentes van empaquetadas (ver control/main.tsx).
      Antes se cargaban tres familias de internet que la interfaz ni usaba, y
      en la PC de la iglesia —sin conexión— sólo sumaban una espera.

      img-src permite https: para las miniaturas de las descargas (i.ytimg.com
      y los CDN de otros sitios que soporta yt-dlp). Es sólo para imágenes:
      scripts y conexiones siguen limitados a la propia app.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data: appfont:; img-src 'self' data: media: audio: https:; media-src 'self' media: audio:; connect-src 'self' ws: http://localhost:* audio:"
    />
    <title>Church Projector — Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./control/main.tsx"></script>
  </body>
</html>
